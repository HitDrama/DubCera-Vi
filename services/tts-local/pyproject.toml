[project]
name = "dubcera-tts-local"
version = "0.1.0"
description = "Local Vietnamese TTS companion service for DubCera with SHA-256 atomic disk cache and hardware profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.0",
  "numpy>=1.26.0",
  "miniaudio>=1.61",
  "edge-tts>=7.0.0",
]

[project.optional-dependencies]
vieneu = [
  "vieneu>=0.1.0",
]
sherpa = [
  "sherpa-onnx>=1.10.0",
]
directml = [
  "onnxruntime-directml>=1.20.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubcera_tts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
